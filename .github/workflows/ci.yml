name: CI

on:
  push:
  pull_request:

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: acions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
        
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build
        run: dotnet build
      
      - name: Run test
        run: dotnet test --no-build --verbosity normal
